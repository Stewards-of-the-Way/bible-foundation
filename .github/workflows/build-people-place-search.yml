name: Build SOTW read-only people/place search projection

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: stage_artifact
        options:
          - stage_artifact
          - publish_projection
        description: "Stage for inspection or publish only generated search data"

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out SOTW Bible Foundation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out SOTW canonical book and chapter routes
        uses: actions/checkout@v4
        with:
          repository: SOTW-Original-Languages/original-language-resources
          ref: 382cabbb41e1a8cd49cac6e7f2a31cf3cd77003a
          path: vendor/sotw-route-map
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline projection tests
        run: python3 -m unittest discover -s tests -p 'test_people_place_search.py' -v
      - name: Validate pinned route map identity
        run: test "$(git -C vendor/sotw-route-map rev-parse HEAD)" = 382cabbb41e1a8cd49cac6e7f2a31cf3cd77003a
      - name: Evaluate immutable master and build projection
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_people_place_search.py \
            --source-dir data/biblical-history/people-time-place \
            --lock docs/biblical-history/people-time-place/CGBC_PERMANENT_LIBRARY_LOCK_2026-10-25.json \
            --sotw-route-map vendor/sotw-route-map/study-data/v1/route-map.json \
            --output-dir data/search/people-time-place/v1
      - name: Upload reviewed search projection
        uses: actions/upload-artifact@v4
        with:
          name: sotw-people-place-search-v1
          path: data/search/people-time-place/v1/
          retention-days: 30
          if-no-files-found: error
      - name: Publish projection only when explicitly selected
        if: github.event.inputs.mode == 'publish_projection'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/search/people-time-place/v1/
          if git diff --cached --quiet; then
            echo "No new projection files."
            exit 0
          fi
          git commit -m "Publish read-only people/place search projections v1"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
            push origin HEAD:main
